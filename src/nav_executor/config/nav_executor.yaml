nav_executor:
  ros__parameters:
    use_sim_time: false
    log_enbaled: true
    tick_frequency: 20.0
    goal_tolerance: 0.02
    retry_delay: 1.0
    planning_timeout: 5.0
    controller_frequency: 20.0
    odom_topic: /odom
    cmd_vel_topic: /cmd_vel
    odom_timeout: 0.5
    tf_timeout: 0.5
    control_timeout: 0.2
    xy_goal_tolerance: 0.3
    yaw_goal_tolerance: 3.14
    stopped_velocity_tolerance: 0.05
    route_monitor:
      enabled: true
      deviation_distance: 0.5
      deviation_duration: 1.0
      stall_duration: 3.0
      minimum_command_speed: 0.1
      minimum_progress: 0.1
      maximum_sample_gap: 0.25
      replan_cooldown: 2.0
      path_blocked:
        enabled: true
        lookahead_distance: 5.0
        safety_margin: 0.05
        confirmations: 3
        maximum_sample_gap: 1.0
    controller_plugins: ["MPPI", "MPC"]
    selected_controller: "MPPI"  # MPPI or MPC; restart after changing
    MPPI:
      plugin: "mppi_controller/MPPIController"
      open_loop: false

    MPC:
      plugin: minco_controller/MPCController
      dt: 0.05
      horizon: 10
      Q: [5.0, 5.0, 2.0]
      R: [1.0, 1.0, 0.5]
      q_along: 3.0
      q_cross: 12.0
      vx_min: -1.0
      vx_max: 1.0
      vy_min: -1.0
      vy_max: 1.0
      omega_min: -2.0
      omega_max: 2.0
      use_acc_constraints: true
      ax_min: -2.0
      ax_max: 2.0
      ay_min: -2.0
      ay_max: 2.0
      alpha_min: -4.0
      alpha_max: 4.0
      max_working_set_recalculations: 200
      eps_regularization: 1.0e-09
      reference_speed: 0.6
      reference_acceleration: 1.0
      reference_yaw_rate: 1.0
      control_delay_compensation: 0.25
      output_delay: 0.025
      use_small_gyro_mode: true
      fixed_wz: 0.0
      deadzone_speed_threshold: 0.02
      velocity_noise_threshold: 0.03
      collision_margin: 0.02

topology_planner:
  ros__parameters:
    use_sim_time: false
    TopoPlanner:
      topology_yaml: ""  # launch resolves the installed topology_global_planner config
      use_topology: true
      fallback_to_inner_planner: false
      allow_nearest_region_fallback: false
      enforce_region_constraint: true
      region_boundary_tolerance: 0.03
      region_constraint_tolerance: 0.15
      transform_tolerance: 0.1
      duplicate_pose_tolerance: 0.02
      blocked_goal_reset_distance: 0.50
      blocked_connector_cost: 999.0
      grid:
        tolerance: 0.2
        use_astar: false
        allow_unknown: false
        use_final_approach_orientation: true
