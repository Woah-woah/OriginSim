nav_executor:
  ros__parameters:
    use_sim_time: false
    tick_frequency: 20.0
    goal_tolerance: 0.02
    retry_delay: 1.0
    planning_timeout: 5.0

topology_planner:
  ros__parameters:
    use_sim_time: false
    TopoPlanner:
      topology_yaml: ""  # launch resolves the installed topology_global_planner config
      use_topology: true
      fallback_to_inner_planner: false
      allow_nearest_region_fallback: false
      enforce_region_constraint: true
      region_boundary_tolerance: 0.03
      region_constraint_tolerance: 0.15
      transform_tolerance: 0.1
      duplicate_pose_tolerance: 0.02
      blocked_goal_reset_distance: 0.50
      blocked_connector_cost: 999.0
      grid:
        tolerance: 0.2
        use_astar: false
        allow_unknown: false
        use_final_approach_orientation: true

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      global_frame: map
      robot_base_frame: base_link_fake
      update_frequency: 10.0
      publish_frequency: 5.0
      transform_tolerance: 0.3
      initial_transform_timeout: 60.0
      robot_radius: 0.15
      resolution: 0.05
      rolling_window: false
      track_unknown_space: true
      always_send_full_costmap: true
      plugins: [static_layer, inflation_layer]
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_topic: /map
        map_subscribe_transient_local: true
        subscribe_to_updates: true
        track_unknown_space: true
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        cost_scaling_factor: 10.0
        inflation_radius: 0.55
