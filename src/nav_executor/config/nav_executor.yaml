nav_executor:
  ros__parameters:
    use_sim_time: false
    log_enbaled: true
    tick_frequency: 20.0
    goal_tolerance: 0.02
    retry_delay: 1.0
    planning_timeout: 5.0
    controller_frequency: 20.0
    odom_topic: /odom
    cmd_vel_topic: /cmd_vel
    odom_timeout: 0.5
    tf_timeout: 0.5
    control_timeout: 0.2
    xy_goal_tolerance: 0.3
    yaw_goal_tolerance: 3.14
    stopped_velocity_tolerance: 0.05
    connector_executor:
      enabled: true            # /serial/head_dowm_cmd must have a single command owner
      region_half_width: 0.8   # m, perpendicular to connector entrance -> exit
      entry_extension: 1.0     # m, before entrance; full footprint intersection triggers
      exit_extension: 0.3      # m, beyond exit
      exit_hysteresis: 0.05    # m, extra clearance before releasing low-head command
      exit_debounce: 0.2       # s, continuously outside before release
      pose_timeout: 0.5        # s, stale/missing TF preserves command and retained regions
    route_monitor:
      enabled: true
      deviation_distance: 0.5
      deviation_duration: 1.0
      stall_duration: 3.0
      minimum_command_speed: 0.1
      minimum_progress: 0.1
      maximum_sample_gap: 0.25
      replan_cooldown: 2.0
      path_blocked:
        enabled: true
        lookahead_distance: 5.0
        safety_margin: 0.05
        confirmations: 3
        maximum_sample_gap: 1.0
    MPC:
      dt: 0.05
      horizon: 10
      Q: [5.0, 5.0, 2.0]
      R: [1.0, 1.0, 0.5]
      control_delta_weight: [2.0, 2.0, 0.5]
      q_along: 3.0
      q_cross: 12.0
      # w * C_linearized(x,y)^2; sequential convex QPs, metres for distances.
      obstacle_weight: 30.0
      obstacle_smoothing_distance: 0.2
      obstacle_trust_region: 0.15
      obstacle_iterations: 3
      vx_min: -1.0
      vx_max: 1.0
      vy_min: -1.0
      vy_max: 1.0
      omega_min: -2.0
      omega_max: 2.0
      use_acc_constraints: true
      ax_min: -2.0
      ax_max: 2.0
      ay_min: -2.0
      ay_max: 2.0
      alpha_min: -4.0
      alpha_max: 4.0
      max_working_set_recalculations: 200
      eps_regularization: 1.0e-09
      reference_speed: 0.6
      reference_acceleration: 1.0
      reference_yaw_rate: 1.0
      control_delay_compensation: 0.25
      output_delay: 0.025
      use_small_gyro_mode: true
      fixed_wz: 0.0
      deadzone_speed_threshold: 0.02
      velocity_noise_threshold: 0.03
      collision_margin: 0.02

topology_planner:
  ros__parameters:
    use_sim_time: false
    TopoPlanner:
      topology_yaml: "topo25.yaml"  # relative to topology_global_planner/config
      use_topology: true
      allow_nearest_region_fallback: false
      region_boundary_tolerance: 0.03
      region_constraint_tolerance: 0.15
      transform_tolerance: 0.1
      grid:
        tolerance: 0.2
        use_astar: false
        allow_unknown: false
        use_final_approach_orientation: true
