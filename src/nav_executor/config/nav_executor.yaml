nav_executor:
  ros__parameters:
    use_sim_time: false
    log_enbaled: true
    tick_frequency: 20.0
    goal_tolerance: 0.02
    retry_delay: 1.0
    planning_timeout: 5.0
    path_smoother:
      enabled: true            # 全路径联合 Minimum Jerk 平滑，失败安全回退
      timeout: 0.3             # s，受全局规划总超时共同限制
      control_spacing: 0.4     # m，短共线控制点合并间距
      corridor_range: 1.0      # m，方形安全走廊最大范围
      max_speed: 1.0           # m/s，仅用于时间分配
      max_acceleration: 1.0    # m/s^2，仅用于时间分配
      collision_iterations: 6
      topology_iterations: 3
    controller_frequency: 20.0
    odom_topic: /odom
    cmd_vel_topic: /cmd_vel
    odom_timeout: 0.5
    tf_timeout: 0.5
    control_timeout: 0.2
    xy_goal_tolerance: 0.3
    yaw_goal_tolerance: 3.14
    stopped_velocity_tolerance: 0.05
    connector_executor:
      enabled: true            # 低头指令仅由本执行器发布
      region_half_width: 0.8   # 单位米，垂直于通道行进方向的半宽
      entry_extension: 1.0     # 单位米，入口前延伸距离，车体轮廓相交时触发
      exit_extension: 0.3      # 单位米，出口后延伸距离
      exit_hysteresis: 0.05    # 单位米，解除低头指令前的额外间距
      exit_debounce: 0.2       # 单位秒，持续离开区域后解除低头指令
      pose_timeout: 0.5        # 单位秒，坐标变换过期或缺失时保留指令与区域
    route_monitor:
      enabled: true
      deviation_distance: 0.5
      deviation_duration: 1.0
      stall_duration: 3.0
      minimum_command_speed: 0.1
      minimum_progress: 0.1
      maximum_sample_gap: 0.25
      replan_cooldown: 2.0
      path_blocked:
        enabled: true
        lookahead_distance: 5.0
        safety_margin: 0.05
        confirmations: 3
        maximum_sample_gap: 1.0
    MPC:
      dt: 0.05
      horizon: 10
      Q: [5.0, 5.0, 2.0]
      R: [1.0, 1.0, 0.5]
      control_delta_weight: [2.0, 2.0, 0.5]
      q_along: 3.0
      q_cross: 12.0
      # 障碍代价为权重乘线性化代价的平方，采用序列凸二次规划，距离单位为米
      obstacle_weight: 30.0
      obstacle_smoothing_distance: 0.2
      obstacle_trust_region: 0.15
      obstacle_iterations: 3
      vx_min: -1.0
      vx_max: 1.0
      vy_min: -1.0
      vy_max: 1.0
      omega_min: -2.0
      omega_max: 2.0
      use_acc_constraints: true
      ax_min: -2.0
      ax_max: 2.0
      ay_min: -2.0
      ay_max: 2.0
      alpha_min: -4.0
      alpha_max: 4.0
      max_working_set_recalculations: 200
      eps_regularization: 1.0e-09
      reference_speed: 0.6
      reference_acceleration: 1.0
      reference_yaw_rate: 1.0
      control_delay_compensation: 0.25
      output_delay: 0.025
      use_small_gyro_mode: true
      fixed_wz: 0.0
      deadzone_speed_threshold: 0.02
      velocity_noise_threshold: 0.03
      collision_margin: 0.02

topology_planner:
  ros__parameters:
    use_sim_time: false
    TopoPlanner:
      topology_yaml: "topo25.yaml"  # 相对于拓扑规划器的配置目录
      use_topology: true
      allow_nearest_region_fallback: false
      region_boundary_tolerance: 0.03
      region_constraint_tolerance: 0.15
      transform_tolerance: 0.1
      grid:
        tolerance: 0.2
        use_astar: false
        allow_unknown: false
        use_final_approach_orientation: true
