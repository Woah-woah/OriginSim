nav_executor:
  ros__parameters:
    MPC:
      dt: 0.05
      horizon: 10
      Q:
      - 5.0
      - 5.0
      - 2.0
      R:
      - 1.0
      - 1.0
      - 0.5
      control_delta_weight: [2.0, 2.0, 0.5]
      q_along: 3.0
      q_cross: 12.0
      # w * C_linearized(x,y)^2; sequential convex QPs, metres for distances.
      obstacle_weight: 30.0
      obstacle_trust_region: 0.15
      obstacle_iterations: 3
      vx_min: -1.0
      vx_max: 1.0
      vy_min: -1.0
      vy_max: 1.0
      omega_min: -2.0
      omega_max: 2.0
      use_acc_constraints: true
      ax_min: -2.0
      ax_max: 2.0
      ay_min: -2.0
      ay_max: 2.0
      alpha_min: -4.0
      alpha_max: 4.0
      max_working_set_recalculations: 200
      eps_regularization: 1.0e-09
      reference_speed: 0.6
      reference_acceleration: 1.0
      reference_yaw_rate: 1.0
      control_delay_compensation: 0.10
      output_delay: 0.025
      use_small_gyro_mode: true
      fixed_wz: 0.0
      deadzone_speed_threshold: 0.02
      velocity_noise_threshold: 0.03
      collision_margin: 0.02
