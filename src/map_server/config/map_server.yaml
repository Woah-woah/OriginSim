map_server:
  ros__parameters:
    use_sim_time: true
    global_frame: map
    robot_base_frame: base_link_fake
    footprint_frame: base_link
    robot_radius: 0.15
    footprint: ''
    footprint_padding: 0.01
    track_unknown_space: true
    inflation_radius: 0.55
    cost_scaling_factor: 5.0
    safety_margin: 0.0  # 额外路径余量仍由原有规划/平滑配置施加，避免重复。
    grid_margin_factor: 0.7071067811865476
    update_frequency: 10.0
    dynamic_obstacles_enabled: false
    cloud_topic: /cloud_registered
    static_pcd: "rmuc2026.pcd"
    cloud_timeout: 0.5
    tf_wait_timeout: 0.15
    max_cloud_points: 200000
    max_accumulated_points: 500000
    accumulate_frames: 4
    accumulate_duration: 0.35
    roi:
      min_radius: 0.4
      max_radius: 8.0
      min_z: 0.0
      max_z: 0.8
    voxel_size: 0.03
    static_voxel_size: 0.05
    static_distance_threshold: 0.2
    sor:
      neighbors: 12
      stddev_multiplier: 2.0
    min_density_per_m2: 400.0
    component_connection_distance: 0.55
    min_component_area: 0.0075
    memory:
      hit_rate: 5.0
      decay_rate: 0.7
      on_threshold: 0.6
      off_threshold: 0.25
      obstacle_timeout: 1.0
      maximum_evidence_dt: 0.2

map_client:
  ros__parameters:
    use_sim_time: true
    global_frame: map
    robot_base_frame: base_link_fake
    footprint_frame: base_link
    robot_radius: 0.15
    footprint: ''
    footprint_padding: 0.01
    track_unknown_space: true
    inflation_radius: 0.55
    cost_scaling_factor: 5.0
    require_cloud: false  # 与当前关闭的动态检测对应；启用动态检测时必须同步改为 true。
    require_radar: false
    map_timeout: 1.0
    transform_tolerance: 0.5
