map_server:
  ros__parameters:
    use_sim_time: true
    global_frame: map
    robot_base_frame: base_link_fake
    footprint_frame: base_link
    robot_radius: 0.15
    footprint: ''
    footprint_padding: 0.01
    track_unknown_space: true
    inflation_radius: 0.55
    cost_scaling_factor: 5.0                # 越大则代价衰减越快
    safety_margin: 0.0                      # 额外路径余量由原有规划/平滑配置施加，避免重复
    grid_margin_factor: 0.7071067811865476  # 栅格离散余量系数；乘地图分辨率得到米，当前值为半格对角线
    update_frequency: 10.0                  # Hz，地图后台更新频率；障碍未变化时复用已有 EDT

    dynamic_obstacles_enabled: false
    cloud_topic: /cloud_registered
    static_pcd: "rmuc2026.pcd"
    cloud_timeout: 0.5                # s，点云观测超过此时间视为过期
    tf_wait_timeout: 0.15             # s，点云按观测时间查询 TF 时允许的等待时限
    max_cloud_points: 10000           # 单帧点云点数预算，超限拒绝，避免处理耗时失控
    max_accumulated_points: 20000     # 累积点云总点数预算
    accumulate_frames: 4              # 最多累积的点云帧数，与下面的时间窗口共同限制
    accumulate_duration: 0.35         # s，点云累积时间窗口
    roi:
      min_radius: 0.4  # m，相对机器人位置的检测内半径，过滤近身点
      max_radius: 8.0  # m，相对机器人位置的检测外半径
      min_z: 0.0       # m，相对机器人位置的检测高度下限
      max_z: 0.8       # m，相对机器人位置的检测高度上限
    voxel_size: 0.03                # m，当前点云的体素降采样尺寸
    static_voxel_size: 0.05         # m，静态参考 PCD 的体素降采样尺寸
    static_distance_threshold: 0.2  # m，与静态 PCD 最近点距离超过此值才视作动态候选
    sor:
      neighbors: 12           # 统计离群点滤波使用的邻居点数
      stddev_multiplier: 2.0  # 离群点滤波的标准差倍数；越小过滤越严格
    min_density_per_m2: 400.0            # 点/m²，二维栅格内保留为障碍所需的最小点密度
    component_connection_distance: 0.55  # m，连通域分析前形态学连接的距离尺度
    min_component_area: 0.0075           # m²，保留的最小障碍连通域面积
    memory:
      hit_rate: 5.0             # 每秒增加的障碍置信度，累计命中使障碍生效
      decay_rate: 0.7           # 每秒衰减的障碍置信度，未持续命中则逐渐消退
      on_threshold: 0.6         # 置信度达到此值后认定为障碍，范围 0～1
      off_threshold: 0.25       # 置信度降至此值后清除；应低于 on_threshold，防止反复闪烁
      obstacle_timeout: 1.0     # s，超过此时间未再次命中，强制清除该动态障碍
      maximum_evidence_dt: 0.2  # s，单次命中最多计入的时间，避免长时间断流后置信度突增


map_client:
  ros__parameters:
    use_sim_time: true
    global_frame: map                 # 地图与规划使用的固定坐标系
    robot_base_frame: base_link_fake
    footprint_frame: base_link
    robot_radius: 0.15
    footprint: ''
    footprint_padding: 0.01
    track_unknown_space: true
    inflation_radius: 0.55
    cost_scaling_factor: 5.0
    require_cloud: false              # 与当前关闭的动态检测对应；启用动态检测时必须同步改为 true。
    require_radar: false              # 是否要求雷达来源健康；开启后缺失或过期会阻止地图用于导航
    map_timeout: 1.0                  # s，地图状态心跳的最大允许时效；不是要求静态地图定期重算
    transform_tolerance: 0.5          # s，机器人位姿 TF 允许的最大数据年龄


nav_executor:
  ros__parameters:
    use_sim_time: true
    log_enbaled: false                # 是否输出终端 Task state 日志
    tick_frequency: 20.0              # TaskManager 检查规划结果、任务状态和路径阻塞的频率
    goal_tolerance: 0.05              # m，重复目标去重的距离阈值；不是控制器到点判据
    retry_delay: 1.0                  # s，规划失败后的重试等待时间
    planning_timeout: 5.0             # s，单次规划总时限，包含拓扑搜索和平滑
    controller_frequency: 50.0        # Hz，局部控制和速度输出频率
    odom_topic: "/odom"
    cmd_vel_topic: "/cmd_vel"
    odom_timeout: 0.5                 # s，里程计允许的最大数据年龄
    tf_timeout: 0.5                   # s，执行器允许的位姿与路径 TF 最大数据年龄
    control_timeout: 0.2              # s，单次控制计算结果的有效时限，超时拒绝采用
    xy_goal_tolerance: 0.3            # m，控制器判定到达目标的位置容差
    yaw_goal_tolerance: 3.14          # rad，控制器判定到达目标的朝向容差；3.14 接近不限制朝向
    stopped_velocity_tolerance: 0.05  # m/s，到点时用于判定平移速度已足够低的阈值
    route_monitor:
      enabled: true
      deviation_distance: 0.5     # m，机器人偏离路径超过此距离开始计时
      deviation_duration: 1.0     # s，持续偏离超过此时间触发重规划
      stall_duration: 3.0         # s，有移动指令但路径进度不足的持续时间阈值
      minimum_command_speed: 0.1  # m/s，超过此指令速度才开始判断是否卡住
      minimum_progress: 0.1       # m，卡住判断中要求取得的最小路径进度
      maximum_sample_gap: 0.25    # s，检查间隔超过此值则重置连续证据，避免把断流算作持续异常
      replan_cooldown: 2.0        # s，两次路线重规划之间的最短间隔
      path_blocked:
        enabled: true
        lookahead_distance: 5.0  # m，从当前路径投影位置向前检查阻塞的弧长
        safety_margin: 0.05      # m，路线阻塞检查在已有车体尺寸之外增加的余量
        confirmations: 3         # 连续多个新地图快照均判为阻塞，才触发重规划
        maximum_sample_gap: 1.0  # s，检查间隔超过此值则重置连续证据，避免把断流算作持续异常
    path_smoother:
      enabled: true            # 全路径联合 Minimum Jerk 平滑，失败安全回退
      timeout: 0.3             # s，受全局规划总超时共同限制
      control_spacing: 0.4     # m，短共线控制点合并间距
      corridor_range: 1.0      # m，方形安全走廊最大范围
      max_speed: 2.5           # m/s，仅用于时间分配
      max_acceleration: 2.2    # m/s^2，仅用于时间分配
      collision_iterations: 6  # 平滑后碰撞复检与约束修正的最大迭代次数
      topology_iterations: 3   # 平滑后拓扑约束复检与修正的最大迭代次数
    connector_executor:
      enabled: true
      region_half_width: 0.8  # 矩形半宽
      entry_extension: 1.0    # 入口前面
      exit_extension: 0.3     # 出口后面
      exit_hysteresis: 0.05   # 出口死区
      exit_debounce: 0.2      # s，持续离开通道区域达到此时间后，才释放占用状态
      pose_timeout: 0.5       # s，位姿缺失或过期时保留原通道状态，不提前释放
    MPC:
      dt: 0.02                               # s，MPC 预测步长；需与控制频率一起考虑
      horizon: 25                            # 预测步数；当前预测时域为 25 × 0.02 = 0.5 s
      Q: [5.0, 5.0, 2.0]                     # 状态误差权重 [x, y, yaw]；当前平移项由 q_along/q_cross 替代，仅 yaw 项生效
      R: [1.0, 1.0, 0.5]                     # 速度前馈偏差权重 [vx, vy, wz]，越大越倾向参考速度
      control_delta_weight: [2.0, 2.0, 0.5]  # 相邻控制量变化权重 [vx, vy, wz]，抑制速度突变
      q_along: 5.0                           # 沿路径切线方向的位置误差权重，与车头朝向无关
      q_cross: 5.0                           # 垂直于路径切线方向的位置误差权重，与车头朝向无关
      obstacle_weight: 30.0                  # EDT 障碍软代价权重；不能替代 Footprint 硬碰撞检查
      obstacle_trust_region: 0.15            # m，每次局部线性化时预测 x/y 各自允许偏移的范围
      obstacle_iterations: 3                 # 障碍代价与安全平面重新线性化的最大迭代次数
      vx_min: -1.7
      vx_max: 1.7
      vy_min: -1.7
      vy_max: 1.7
      omega_min: -2.0
      omega_max: 2.0
      use_acc_constraints: false             # 是否启用下方线加速度和角加速度约束
      ax_min: -1.5
      ax_max: 1.5
      ay_min: -1.5
      ay_max: 1.5
      alpha_min: -4.0
      alpha_max: 4.0
      max_working_set_recalculations: 200    # qpOASES 单次求解的工作集重计算次数上限
      eps_regularization: 1.0e-09            # QP 数值正则化系数，用于改善矩阵数值稳定性
      reference_speed: 1.2                   # m/s，参考轨迹速度上限；不是直接发布的速度指令
      reference_acceleration: 1.0            # m/s²，参考轨迹时间参数化的加速度上限
      reference_yaw_rate: 1.0                # rad/s，参考轨迹转向速度上限；小陀螺模式角速度由 fixed_wz 指定
      control_delay_compensation: 0.10       # s，名义执行延迟：先按实测速度预测；硬检查同时覆盖 0～此值的延迟
      output_delay: 0.025                    # s，用于速度前馈方向的旋转相位补偿；不额外叠加到参考采样时间
      use_small_gyro_mode: true              # 启用固定角速度模式，车头朝向与路径切线分离
      fixed_wz: 0.0                          # rad/s，小陀螺模式的固定角速度；0 表示不主动旋转
      deadzone_speed_threshold: 0.02         # 小速度死区，平移分量单位 m/s，角速度分量单位 rad/s；在 QP 内处理
      velocity_noise_threshold: 0.03         # 实测速度噪声阈值；仅在上一指令也接近零时抑制，单位同上
      collision_margin: 0.02                 # m，MPC 在已有外扩轮廓之外要求的额外硬碰撞净空


topology_planner:
  ros__parameters:
    use_sim_time: true
    TopoPlanner:
      topology_yaml: "topo26.yaml"
      use_topology: true
      allow_nearest_region_fallback: false  # 起终点不属于任何区域时，是否允许选择最近区域
      region_boundary_tolerance: 0.03       # m，识别点是否位于 Region 边界时的容差
      region_constraint_tolerance: 0.15     # m，路径区域归属复检的边界容差；不放宽障碍碰撞限制
      transform_tolerance: 0.1              # s，拓扑规划查询 TF 的等待时限
      grid:
        tolerance: 0.2                        # m，精确目标不可达时允许选取附近可达目标的最大距离
        use_astar: false                      # 仅选择目标可达性搜索 A*/Dijkstra；路径均由 FMM 连续势场梯度提取
        allow_unknown: false                  # 与二值平滑器及碰撞复检保持一致
        use_final_approach_orientation: true  # true：末端朝向沿接近路径；false：使用目标消息中的朝向
