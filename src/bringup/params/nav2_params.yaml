
local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 10.0
      publish_frequency: 5.0
      global_frame: odom
      robot_base_frame: base_link_fake
      #robot_base_frame: base_link
      use_sim_time: True
      rolling_window: true
      always_send_full_costmap: true
      width: 9
      height: 9
      resolution: 0.05
      robot_radius: 0.15
      # plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      plugins: ["static_layer", "inflation_layer"]
      # plugins: ["static_layer", "dynamic_layer", "terrain_layer", "inflation_layer"]
      terrain_layer:
        plugin: "terrain_layer::TerrainLayer"
        enabled: true
        terrain_yaml: "terrain.yaml"  # Rewritten to the installed package path by navigation_launch.py
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 10.0
        inflation_radius: 0.55
      dynamic_layer:
        plugin: dynamic_layer::DynamicLayer
        # The referenced static PCD is not present in this workspace. Keep the plugin loaded but
        # disabled until a valid static_pcd_path is supplied.
        enabled: false
        cloud_topic: /livox/lidar/pointcloud
        static_pcd_path: /home/hexinyi/sim/sim_origion_nav/src/localization/Point-LIO-grid_map_ros2/PCD/scans_map_zmax3.pcd
        map_frame: map
        odom_frame: odom
        sensor_frame: aft_mapped
        accumulate_frames: 6
        voxel: 0.02
        static_voxel: 0.05
        distance_threshold: 0.2
        sor_neighbors: 12
        sor_std_mul: 2.0
        density: 800.0
        min_cluster_area: 0.0075
        roi_xy_radius_min: 0.4
        roi_xy_radius_max: 8.0
        roi_z_min: -0.3
        roi_z_max: 1.0
        transform_tolerance: 0.1
        observation_timeout: 0.8
        max_accumulation_time: 0.8
        reset_translation: 0.1
        reset_rotation: 0.05
        publish_debug: true
        debug_topic: /dynamic_obstacle_points

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: livox 
        max_obstacle_height: 1.0
        min_obstacle_height: -1.0
        livox:
          topic: /scan
          max_obstacle_height: 1.0
          min_obstacle_height: -1.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 10.0
          raytrace_min_range: 0.1
          obstacle_max_range: 10.0
          obstacle_min_range: 0.1
      # voxel_layer:
      #   plugin: "nav2_costmap_2d::VoxelLayer"
      #   enabled: True
      #   publish_voxel_map: True
      #   origin_z: -0.55
      #   z_resolution: 0.05
      #   z_voxels: 16
      #   min_obstacle_height: 1.0
      #   max_obstacle_height: 1.0
      #   mark_threshold: 0
      #   observation_sources: pointcloud
      #   pointcloud:
      #     topic: /segmentation/obstacle
      #     min_obstacle_height: -1.0
      #     max_obstacle_height: 1.0
      #     clearing: True
      #     marking: True
      #     data_type: "PointCloud2"
      #     raytrace_max_range: 5.0
      #     raytrace_min_range: 0.0
      #     obstacle_max_range: 3.0
      #     obstacle_min_range: 0.0
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
        map_topic: /map


global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 10.0
      publish_frequency: 5.0
      global_frame: map
      robot_base_frame: base_link_fake
      #robot_base_frame: base_link
      use_sim_time: True
      robot_radius: 0.15
      resolution: 0.05
      track_unknown_space: True
      static_map: True
      #plugins: ["static_layer", "obstacle_layer","inflation_layer"]
      plugins: ["static_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: False
        observation_sources: livox
        max_obstacle_height: 100.0
        min_obstacle_height: -100.0
        livox:
          topic: /scan
          max_obstacle_height: 100.0
          min_obstacle_height: -100.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 10.0
          raytrace_min_range: 0.1
          obstacle_max_range: 10.0
          obstacle_min_range: 0.1
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
        track_unknown_space: True
        map_topic: /map
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 10.0
        inflation_radius: 0.55
      always_send_full_costmap: True


map_server:
  ros__parameters :
    use_sim_time: True
    # Overridden in launch by the "map" launch configuration or provided default value.
    # To use in yaml, remove the default "map" value in the tb3_simulation_launch.py file & provide full path to map below.
    yaml_filename: ""

map_saver:
  ros__parameters:
    use_sim_time: True
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: True

nav_executor:
  ros__parameters:
    use_sim_time: true
    tick_frequency: 20.0
    goal_tolerance: 0.02
    retry_delay: 1.0
    planning_timeout: 5.0
    controller_frequency: 20.0
    odom_topic: "/odom"
    cmd_vel_topic: "/cmd_vel"
    odom_timeout: 0.5
    tf_timeout: 0.5
    control_timeout: 0.2
    xy_goal_tolerance: 0.3
    yaw_goal_tolerance: 3.14
    stopped_velocity_tolerance: 0.05
    route_monitor:
      enabled: true
      deviation_distance: 0.5
      deviation_duration: 1.0
      stall_duration: 3.0
      minimum_command_speed: 0.1
      minimum_progress: 0.1
      maximum_sample_gap: 0.25
      replan_cooldown: 2.0
    FollowPath:
      open_loop: false
      time_steps: 40       # prediction_time = time_steps × model_dt
      model_dt: 0.05       # prediction_distance ≈ prediction_time × max_speed 全向底盘应该考虑合速度
      batch_size: 1000     # model_dt ≈ 1 / controller_frequency 其实就是控制周期 可以比控制周期小 不建议更大
      vx_std: 0.5          # 采样标准差控制搜索范围
      vy_std: 0.5
      wz_std: 0.1
      vx_max: 2.0
      vx_min: -2.0
      vy_max: 2.0
      wz_max: 0.1
      ax_max: 15.0
      ax_min: -15.0
      ay_min: -15.0
      ay_max: 15.0
      az_max: 0.1
      iteration_count: 1   # 每周期优化次数
      prune_distance: 2.8  # 控制前方约多远的全局路径
      transform_tolerance: 0.1
      temperature: 0.5         # cost选择锐度 越小越偏向最低 cost 轨迹
      gamma: 0.015             # 控制平滑/能量权衡一般不要乱动
      motion_model: "Omni"
      visualize: true
      regenerate_noises: false  # 是否每轮重新采样噪声 false可以减少计算抖动
      TrajectoryVisualizer:
        trajectory_step: 5
        time_step: 3
      critics: ["ConstraintCritic", "GoalCritic", "PathAlignCritic", "PathFollowCritic", "ObstaclesCritic"]
      ConstraintCritic:  # 惩罚违反运动学或动力学约束的轨迹
        enabled: true
        cost_power: 1
        cost_weight: 8.0
      GoalCritic:        # 靠近目标以后，让机器人真正向目标位置收敛
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 1.7       # Dprediction = time_steps × model_dt × max_speed
      PathFollowCritic:  # 和GoalCritic是一对, 沿着路径取得进展, 负责往前走的意愿
        enabled: true
        cost_power: 1
        cost_weight: 13.0
        offset_from_furthest: 7
        threshold_to_consider: 1.5
      PathAlignCritic:   # 贴着全局路径
        enabled: true
        cost_power: 1
        cost_weight: 17.0
        max_path_occupancy_ratio: 0.07 # 当全局路径有较多部分被障碍物占据时, PathAlignCritic减少/停止发挥作用
        trajectory_point_step: 4
        threshold_to_consider: 0.5
        offset_from_furthest: 5       # 候选轨迹至少沿全局路径推进到一定程度之后，再开始强调路径对齐
        use_path_orientations: false
      ObstaclesCritic:
        enabled: true
        cost_power: 1
        repulsion_weight: 7.0      # 和inflation_radius cost_scaling_factor 机器人尺寸强相关
        critical_weight: 1000.0      # 马上快撞了！
        consider_footprint: false   # false时主要使用点/圆形机器人形式的检查
        collision_cost: 10000.0
        collision_margin_distance: 0.05  # 真实碰撞边界之外留一层严重惩罚区
        near_goal_distance: 0.5

topology_planner:
  ros__parameters:
    use_sim_time: true
    TopoPlanner:
      topology_yaml: "topo.yaml"  
      use_topology: false
      fallback_to_inner_planner: false
      allow_nearest_region_fallback: false
      enforce_region_constraint: true
      region_boundary_tolerance: 0.03
      region_constraint_tolerance: 0.15
      transform_tolerance: 0.1
      duplicate_pose_tolerance: 0.02
      blocked_goal_reset_distance: 0.50
      blocked_connector_cost: 999.0
      grid:
        tolerance: 0.2
        use_astar: false
        allow_unknown: true
        use_final_approach_orientation: true

robot_state_publisher:
  ros__parameters:
    use_sim_time: True

