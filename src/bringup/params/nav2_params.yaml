local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 10.0
      publish_frequency: 5.0
      global_frame: odom
      robot_base_frame: base_link_fake
      #robot_base_frame: base_link
      use_sim_time: True
      rolling_window: true
      always_send_full_costmap: true
      width: 9
      height: 9
      resolution: 0.05
      robot_radius: 0.15
      # plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      plugins: ["static_layer", "inflation_layer"]
      # plugins: ["static_layer", "dynamic_layer", "terrain_layer", "inflation_layer"]
      terrain_layer:
        plugin: "terrain_layer::TerrainLayer"
        enabled: true
        terrain_yaml: "terrain.yaml"  # Rewritten to the installed package path by navigation_launch.py
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 10.0
        inflation_radius: 0.55
      dynamic_layer:
        plugin: dynamic_layer::DynamicLayer
        # The referenced static PCD is not present in this workspace. Keep the plugin loaded but
        # disabled until a valid static_pcd_path is supplied.
        enabled: false
        cloud_topic: /livox/lidar/pointcloud
        static_pcd_path: /home/hexinyi/sim/sim_origion_nav/src/localization/Point-LIO-grid_map_ros2/PCD/scans_map_zmax3.pcd
        map_frame: map
        odom_frame: odom
        sensor_frame: aft_mapped
        accumulate_frames: 6
        voxel: 0.02
        static_voxel: 0.05
        distance_threshold: 0.2
        sor_neighbors: 12
        sor_std_mul: 2.0
        density: 800.0
        min_cluster_area: 0.0075
        roi_xy_radius_min: 0.4
        roi_xy_radius_max: 8.0
        roi_z_min: -0.3
        roi_z_max: 1.0
        transform_tolerance: 0.1
        observation_timeout: 0.8
        max_accumulation_time: 0.8
        reset_translation: 0.1
        reset_rotation: 0.05
        publish_debug: true
        debug_topic: /dynamic_obstacle_points

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: livox 
